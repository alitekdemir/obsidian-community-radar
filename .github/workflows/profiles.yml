# AI plugin profiles: every hour, profiles new community plugins and those whose README changed with
# free OpenRouter models, tags untagged ones from the closed vocabulary, rebuilds index.json, then the
# "Similar" lists (similar.json, see scripts/similar) on the `profiles` branch, which the plugin
# downloads. Publishes only when something changed. The branch holds a single commit, replaced on each
# publish, so the repository doesn't grow. A run that leaves work in the queue starts the next one itself
# while the day's free requests last (scripts/profiles/update.py writes `more`).
name: Profiles

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # the keepalive step and the queue's next run (gh workflow run)

concurrency:
  group: profiles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # an hourly job; a healthy run takes a few minutes
    steps:
      - uses: actions/checkout@v4

      - name: Current profiles
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin profiles >/dev/null; then
            git fetch --depth 1 origin profiles
            git --work-tree=out checkout FETCH_HEAD -- . && git reset -q
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet markdown-it-py jsonschema numpy scikit-learn

      - name: Update
        id: update
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROFILE_MODELS: ${{ vars.PROFILE_MODELS }}     # empty: today's free models
          REPROFILE_MODEL: ${{ vars.REPROFILE_MODEL }}   # empty: no re-profiling
        run: python -u scripts/profiles/update.py out   # -u: log lines appear as they happen

      - name: Description vectors (embeddings branch, built daily)
        id: vectors
        run: |
          mkdir -p vectors
          if git ls-remote --exit-code --heads origin embeddings >/dev/null; then
            git fetch --depth 1 origin embeddings
            git --work-tree=vectors checkout FETCH_HEAD -- granite-311m.bin granite-311m.json && git reset -q
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Similar lists
        id: similar
        if: steps.vectors.outputs.ready == 'true'
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ ! -f out/index.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXTRA=""
          if [ "$CHANGED" != "true" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            EXTRA="--skip-if-current"
          fi
          python -u scripts/similar/build.py --profiles out --vectors vectors $EXTRA

      - name: Publish to the profiles branch
        if: steps.update.outputs.changed == 'true' || steps.similar.outputs.changed == 'true'
        working-directory: out
        run: |
          git init -q -b profiles
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Profiles $(date -u +'%F %H:%M')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" profiles

      - name: Go on with the queue (a new run, while free requests are left today)
        if: steps.update.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}   # workflow_dispatch is the exception: GITHUB_TOKEN can start it
        run: gh workflow run profiles.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Keep the schedule alive (GitHub turns off scheduled runs after 60 days without commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profiles.yml/enable"
