# AI plugin profiles: every hour, profiles new community plugins and those whose README changed with
# free OpenRouter models, tags untagged ones from the closed vocabulary, and rebuilds index.json on the
# `profiles` branch, which the plugin downloads. Publishes only when something changed. The branch holds
# a single commit, replaced on each publish, so the repository doesn't grow.
name: Profiles

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # the keepalive step below

concurrency:
  group: profiles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # an hourly job; a healthy run takes a few minutes
    steps:
      - uses: actions/checkout@v4

      - name: Current profiles
        run: |
          mkdir -p out
          git fetch --depth 1 origin profiles
          git --work-tree=out checkout FETCH_HEAD -- . && git reset -q

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet markdown-it-py jsonschema

      - name: Update
        id: update
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROFILE_MODELS: ${{ vars.PROFILE_MODELS }}     # empty: today's free models
          REPROFILE_MODEL: ${{ vars.REPROFILE_MODEL }}   # empty: no re-profiling
        run: python -u scripts/profiles/update.py out   # -u: log lines appear as they happen

      - name: Publish to the profiles branch
        if: steps.update.outputs.changed == 'true'
        working-directory: out
        run: |
          git init -q -b profiles
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Profiles $(date -u +'%F %H:%M')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" profiles

      - name: Keep the schedule alive (GitHub turns off scheduled runs after 60 days without commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profiles.yml/enable"
