name: Release assets

# Push a tag equal to manifest.json's version (e.g. 0.8.2, no "v"), or publish a release with that tag
# (title and notes may stay empty). This workflow tests and builds that commit (main.js is built from src/
# and locales/), writes the notes from the version's CHANGELOG.md section when there are none, attests
# main.js / manifest.json / styles.css and attaches them.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check that the tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "$TAG"
      - name: Release notes from CHANGELOG.md (creates the release, or fills an empty one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="## $TAG" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no ## $TAG section"; exit 1; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          elif [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          fi
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber
