# Semantic vectors for "Similar": embeds every community plugin's name and description once a day
# (only new or edited ones) and keeps the files on the `embeddings` branch, which the plugin downloads.
# Each model runs in its own job, in parallel; the branch holds a single commit, replaced on each run,
# so the repository doesn't grow.
name: Embeddings

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "Models to build (space separated): granite-311m granite-97m harrier-270m"
        default: "granite-311m"
      report:
        description: "Also write a side-by-side comparison report"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # the keepalive step below

concurrency:
  group: embeddings
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.models.outputs.list }}
    steps:
      - id: models
        env:
          MODELS: ${{ inputs.models || 'granite-311m' }}
        run: echo "list=$(jq -cn --arg m "$MODELS" '$m | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  embed:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    steps:
      - uses: actions/checkout@v4

      - name: Previous vectors (reused for unchanged plugins)
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin embeddings >/dev/null; then
            git fetch --depth 1 origin embeddings
            git --work-tree=out checkout FETCH_HEAD -- . && git reset -q
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.model }}

      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "sentence-transformers>=5" numpy

      - name: Embed
        run: python scripts/embeddings/embed.py --out out --model ${{ matrix.model }}

      - uses: actions/upload-artifact@v4
        with:
          name: vectors-${{ matrix.model }}
          path: |
            out/${{ matrix.model }}.bin
            out/${{ matrix.model }}.json
          retention-days: 3

  publish:
    needs: embed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Previous vectors (models not rebuilt this time stay)
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin embeddings >/dev/null; then
            git fetch --depth 1 origin embeddings
            git --work-tree=out checkout FETCH_HEAD -- . && git reset -q
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: vectors-*
          path: out
          merge-multiple: true

      - name: Report
        if: ${{ inputs.report }}
        run: |
          pip install --quiet numpy
          python scripts/embeddings/embed.py --out out --report report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.report }}
        with:
          name: similar-report
          path: report.md

      - name: Publish to the embeddings branch
        working-directory: out
        run: |
          ls -la
          git init -q -b embeddings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Embeddings $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" embeddings

      - name: Keep the schedule alive (GitHub turns off scheduled runs after 60 days without commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/embeddings.yml/enable"
