# Semantic vectors for "Similar": embeds every community plugin's name and description once a day
# (only new or edited ones) and keeps the files on the `embeddings` branch, which the plugin downloads.
# The branch holds a single commit, replaced on each run, so the repository doesn't grow.
name: Embeddings

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "Models to build (space separated): granite-311m granite-97m harrier-270m"
        default: "granite-311m"
      report:
        description: "Also write a side-by-side comparison report"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: embeddings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Previous vectors (reused for unchanged plugins)
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin embeddings >/dev/null; then
            git fetch --depth 1 origin embeddings
            git --work-tree=out checkout FETCH_HEAD -- .
            git reset -q
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.models || 'granite-311m' }}

      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "sentence-transformers>=5" numpy

      - name: Embed
        env:
          MODELS: ${{ inputs.models || 'granite-311m' }}
          REPORT: ${{ inputs.report && 'report.md' || '' }}
        run: |
          args=""
          for m in $MODELS; do args="$args --model $m"; done
          python scripts/embeddings/embed.py --out out $args ${REPORT:+--report $REPORT}
          ls -la out
          if [ -n "$REPORT" ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Report
        if: ${{ inputs.report }}
        uses: actions/upload-artifact@v4
        with:
          name: similar-report
          path: report.md

      - name: Publish to the embeddings branch
        working-directory: out
        run: |
          git init -q -b embeddings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Embeddings $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" embeddings
