name: Feature request
description: An idea that would make Community Radar more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or question behind the idea — this matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Screenshots or sketches are welcome.
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
